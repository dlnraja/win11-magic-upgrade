name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-compile:
    name: Python engine compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all engine modules
        shell: powershell
        run: |
          Get-ChildItem python -Filter *.py -Recurse | ForEach-Object {
            python -m py_compile $_.FullName
            Write-Host "OK $($_.FullName)"
          }
      - name: Import engine
        run: python -c "import sys; sys.path.insert(0,'python'); from engine import run_diagnose; print('engine ok')"

  powershell-legacy-syntax:
    name: Legacy PowerShell syntax (optional)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse legacy scripts if present
        shell: powershell
        run: |
          $files = @(Get-ChildItem -Path src, build -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) { throw "Parse fail $($f.Name)" }
            Write-Host "OK $($f.Name)"
          }

  i18n-json:
    name: i18n JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate strings.json
        run: python -c "import json; d=json.load(open('i18n/strings.json',encoding='utf-8')); assert 'en' in d and 'fr' in d; assert d['en'].keys()==d['fr'].keys()"
