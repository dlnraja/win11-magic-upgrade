name: Release

# Tag-only publish. No pull_request / issue_comment triggers (AI & classic CI/CD attack surface).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Label only (does not alter build inputs; tags publish releases)'
        required: true
        default: 'dev'

# Default deny; elevate only on the publish job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-portable:
    runs-on: windows-latest
    # Optional hardening: in GitHub → Settings → Environments, create `release`
    # with required reviewers, then uncomment:
    # environment: release
    permissions:
      contents: write  # softprops/action-gh-release needs this on tag pushes only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Reject unsafe ref forms
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # Do not interpolate untrusted text into shell beyond env binding.
          echo "ref_type=$REF_TYPE"
          if [[ "$REF_TYPE" == "tag" ]]; then
            case "$REF" in
              refs/tags/v*) ;;
              *) echo "Refusing non-v* tag release: $REF"; exit 1 ;;
            esac
          fi

      - name: Prepare Authenticode (dlnraja)
        shell: powershell
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
          MAGIC_CODESIGN_PFX_BASE64: ${{ secrets.MAGIC_CODESIGN_PFX_BASE64 }}
          MAGIC_CODESIGN_PASSWORD: ${{ secrets.MAGIC_CODESIGN_PASSWORD }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\ci_prepare_codesign.ps1

      - name: Build + sign portable package
        shell: powershell
        env:
          MAGIC_REQUIRE_CODESIGN: "1"
          # MAGIC_CODESIGN_* injected into GITHUB_ENV by prepare step
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\build_exe.ps1

      - name: Verify Authenticode (CN=dlnraja)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\verify_signature.ps1 `
            -ExePath .\dist\Win11MagicUpgrade.exe `
            -ExpectPublisher dlnraja
          if (Test-Path .\dist\PUBLISHER.txt) { Get-Content .\dist\PUBLISHER.txt }
          if (Test-Path .\dist\SHA256SUMS.txt) { Get-Content .\dist\SHA256SUMS.txt }
          Get-ChildItem .\dist\*.zip | ForEach-Object { $_.FullName; $_.Length }

      - name: Submit to VirusTotal (optional reputation)
        shell: powershell
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          MAGIC_VT_API_KEY: ${{ secrets.MAGIC_VT_API_KEY }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\submit_virustotal.ps1 `
            -ExePath .\dist\Win11MagicUpgrade.exe `
            -VoteHarmless

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Win11MagicUpgrade-Portable
          path: |
            dist/Win11MagicUpgrade-Portable/**
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DOWNLOAD.txt
            dist/PUBLISHER.txt
            dist/PUBLISHER.json
            dist/RELEASE-ASSETS.json
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (tags only)
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DOWNLOAD.txt
            dist/PUBLISHER.txt
            dist/Win11MagicUpgrade.exe
          generate_release_notes: true
          body: |
            ## Download (Chrome-friendly)

            **Prefer the ZIP** (Chrome Safe Browsing often blocks naked EXEs on new builds):

            1. `Win11MagicUpgrade-Portable-v*.zip`
            2. Verify `SHA256SUMS.txt`
            3. Extract → run `Win11MagicUpgrade.exe` as Administrator

            If Chrome says “virus detected”: see [docs/DOWNLOAD.md](https://github.com/dlnraja/win11-magic-upgrade/blob/main/docs/DOWNLOAD.md) — Keep anyway / Unblock-File / report FP to Google.

            ## Publisher

            Authenticode: **dlnraja** (Release workflow).  
            For SmartScreen reputation, add a trusted OV/EV PFX via secrets `CODESIGN_PFX_BASE64` + `CODESIGN_PASSWORD`.  
            Optional VirusTotal submit: secret `VIRUSTOTAL_API_KEY`.

            Not malware — open source MIT. See SECURITY.md.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
