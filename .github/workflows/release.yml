name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. 1.0.0)'
        required: true
        default: 'dev'

permissions:
  contents: write

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable package
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\build_exe.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Win11MagicUpgrade-Portable
          path: dist/Win11MagicUpgrade-Portable/**
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Win11MagicUpgrade.exe
          generate_release_notes: true
          body: |
            Portable folder artifact is attached to the workflow run.
            Prefer the `Win11MagicUpgrade-Portable` artifact (EXE + src + vendor + cmd).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
