name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Never use pull_request_target â€” untrusted fork code + secrets = classic CI/CD attack

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-compile:
    name: Python engine compile
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile all engine modules
        shell: powershell
        run: |
          Get-ChildItem python -Filter *.py -Recurse | ForEach-Object {
            python -m py_compile $_.FullName
            Write-Host "OK $($_.FullName)"
          }
      - name: Import engine
        run: python -c "import sys; sys.path.insert(0,'python'); from engine import run_diagnose; print('engine ok')"
      - name: UIA guard unit smoke
        run: python -c "import sys; sys.path.insert(0,'python'); from engine.uia_guard import assess_uia_risk; r=assess_uia_risk(); print('uia', r.score, r.reasons)"

  powershell-legacy-syntax:
    name: Legacy PowerShell syntax (optional)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse legacy scripts if present
        shell: powershell
        run: |
          $files = @(Get-ChildItem -Path src, build -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) { throw "Parse fail $($f.Name)" }
            Write-Host "OK $($f.Name)"
          }

  i18n-json:
    name: i18n JSON
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate strings.json
        run: python -c "import json; d=json.load(open('i18n/strings.json',encoding='utf-8')); assert 'en' in d and 'fr' in d; assert d['en'].keys()==d['fr'].keys()"

  secret-hygiene:
    name: Secret / token hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block committed credentials patterns
        run: |
          set -euo pipefail
          # Fail if high-signal secret material appears in tracked source (not docs examples).
          if git grep -nI -E '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})' -- \
              ':!.github/**' ':!SECURITY.md' ':!README.md' ':!docs/**' \
              && false; then
            echo "Possible secret material in tree"
            exit 1
          fi
          # Never allow av_keys.json or .env in git
          if git ls-files | grep -E '(^|/)\.env$|(^|/)av_keys\.json$'; then
            echo "Forbidden secrets file tracked"
            exit 1
          fi
          echo "secret hygiene OK"

  codesign-smoke:
    name: Authenticode sign smoke (dlnraja)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Authenticode
        shell: powershell
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
          MAGIC_CODESIGN_PFX_BASE64: ${{ secrets.MAGIC_CODESIGN_PFX_BASE64 }}
          MAGIC_CODESIGN_PASSWORD: ${{ secrets.MAGIC_CODESIGN_PASSWORD }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\ci_prepare_codesign.ps1
      - name: Sign dummy payload + verify CN=dlnraja
        shell: powershell
        env:
          MAGIC_REQUIRE_CODESIGN: "1"
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "sign-smoke"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $exe = Join-Path $dir "smoke.exe"
          $tmpCs = Join-Path $dir "smoke.cs"
          Set-Content -LiteralPath $tmpCs -Value @'
          using System;
          static class P { static void Main() { Console.WriteLine("dlnraja"); } }
          '@ -Encoding ASCII
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          & $csc /nologo /out:$exe /target:exe $tmpCs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\sign_exe.ps1 -ExePath $exe -Publisher dlnraja
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\verify_signature.ps1 -ExePath $exe -ExpectPublisher dlnraja
