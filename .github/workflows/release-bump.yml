name: Release bump

# After a code merge to main, create the next semver tag on that commit.
# Never push a commit back to main: this checkout is shallow, and GitHub
# rejects that push ("shallow update not allowed"). release.yml stamps
# VERSION from the tag while it builds.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-main:
    name: Tag main after code merge
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.repository == 'dlnraja/win11-magic-upgrade'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 50
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Push the release tag only
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python build/ci_release_bump.py
