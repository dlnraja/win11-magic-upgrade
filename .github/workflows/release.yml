name: Release

# Tag-only publish. No pull_request / issue_comment triggers (AI & classic CI/CD attack surface).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Label only (does not alter build inputs; tags publish releases)'
        required: true
        default: 'dev'

# Default deny; elevate only on the publish job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-portable:
    runs-on: windows-latest
    # Optional hardening: in GitHub → Settings → Environments, create `release`
    # with required reviewers, then uncomment:
    # environment: release
    permissions:
      contents: write  # softprops/action-gh-release needs this on tag pushes only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Reject unsafe ref forms
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # Do not interpolate untrusted text into shell beyond env binding.
          echo "ref_type=$REF_TYPE"
          if [[ "$REF_TYPE" == "tag" ]]; then
            case "$REF" in
              refs/tags/v*) ;;
              *) echo "Refusing non-v* tag release: $REF"; exit 1 ;;
            esac
          fi

      - name: Build portable package
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\build_exe.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Win11MagicUpgrade-Portable
          path: dist/Win11MagicUpgrade-Portable/**
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (tags only)
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/Win11MagicUpgrade.exe
          generate_release_notes: true
          body: |
            Portable folder artifact is attached to the workflow run.
            Prefer the `Win11MagicUpgrade-Portable` artifact (EXE + src + vendor + cmd).

            Built with SHA-pinned Actions; see SECURITY.md (CI/CD hardening).
            Publisher / Authenticode subject: **dlnraja**
            (`CN=dlnraja` — use a trusted PFX via `MAGIC_CODESIGN_PFX` for SmartScreen).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
