name: Release

# Tag-only publish. No pull_request / issue_comment triggers (AI & classic CI/CD attack surface).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Label only (does not alter build inputs; tags publish releases)'
        required: true
        default: 'dev'

# Default deny; elevate only on the publish job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-portable:
    runs-on: windows-latest
    # Optional hardening: in GitHub -> Settings -> Environments, create `release`
    # with required reviewers, then uncomment:
    # environment: release
    permissions:
      contents: write  # softprops/action-gh-release needs this on tag pushes only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Reject unsafe ref forms
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # Do not interpolate untrusted text into shell beyond env binding.
          echo "ref_type=$REF_TYPE"
          if [[ "$REF_TYPE" == "tag" ]]; then
            case "$REF" in
              refs/tags/v*) ;;
              *) echo "Refusing non-v* tag release: $REF"; exit 1 ;;
            esac
          fi

      - name: Prepare Authenticode (dlnraja)
        shell: powershell
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
          MAGIC_CODESIGN_PFX_BASE64: ${{ secrets.MAGIC_CODESIGN_PFX_BASE64 }}
          MAGIC_CODESIGN_PASSWORD: ${{ secrets.MAGIC_CODESIGN_PASSWORD }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\ci_prepare_codesign.ps1
          # If a real PFX secret is present, require SmartScreen-ready Valid signature
          if ($env:CODESIGN_PFX_BASE64 -and $env:CODESIGN_PFX_BASE64.Trim().Length -gt 80) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value 'MAGIC_REQUIRE_TRUSTED_CODESIGN=1'
            Write-Host 'Trusted PFX secret detected -> MAGIC_REQUIRE_TRUSTED_CODESIGN=1'
          } elseif ($env:MAGIC_CODESIGN_PFX_BASE64 -and $env:MAGIC_CODESIGN_PFX_BASE64.Trim().Length -gt 80) {
            Add-Content -LiteralPath $env:GITHUB_ENV -Value 'MAGIC_REQUIRE_TRUSTED_CODESIGN=1'
            Write-Host 'Trusted PFX secret detected -> MAGIC_REQUIRE_TRUSTED_CODESIGN=1'
          }

      - name: Build + sign portable package
        shell: powershell
        env:
          MAGIC_REQUIRE_CODESIGN: "1"
          # MAGIC_CODESIGN_* / MAGIC_REQUIRE_TRUSTED_CODESIGN injected by prepare step
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\build_exe.ps1

      - name: Verify Authenticode (CN=dlnraja)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\verify_signature.ps1 `
            -ExePath .\dist\Win11MagicUpgrade.exe `
            -ExpectPublisher dlnraja
          if (Test-Path .\dist\PUBLISHER.txt) { Get-Content .\dist\PUBLISHER.txt }
          if (Test-Path .\dist\PUBLISHER.json) { Get-Content .\dist\PUBLISHER.json }
          if (Test-Path .\dist\SHA256SUMS.txt) { Get-Content .\dist\SHA256SUMS.txt }
          Get-ChildItem .\dist\*.zip | ForEach-Object { $_.FullName; $_.Length }

      # Optional: SignPath Foundation (free OV for OSS) — linked to your GitHub account.
      # Apply at https://signpath.org / https://signpath.io then set:
      #   secret SIGNPATH_API_TOKEN
      #   vars  SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
      # Skipped when your own CODESIGN_PFX_BASE64 is already present (prefer your PFX).
      - name: Detect SignPath OSS signing
        id: signpath
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          HAS_PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${HAS_PFX:-}" && ${#HAS_PFX} -gt 80 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Own CODESIGN_PFX_BASE64 present - skipping SignPath"
            exit 0
          fi
          if [[ -n "${TOKEN:-}" && -n "${ORG_ID:-}" && -n "${PROJECT:-}" && -n "${POLICY:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath OSS signing enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SignPath not configured (optional). See docs/CODESIGN.md"
          fi

      - name: Upload EXE for SignPath
        if: steps.signpath.outputs.enabled == 'true'
        id: upload-for-signpath
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Win11MagicUpgrade-unsigned-for-signpath
          path: dist/Win11MagicUpgrade.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath (GitHub-linked OSS cert)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-for-signpath.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/

      - name: Repackage after SignPath
        if: steps.signpath.outputs.enabled == 'true'
        shell: powershell
        run: |
          $exe = Join-Path $PWD "dist\Win11MagicUpgrade.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "SignPath did not produce dist/Win11MagicUpgrade.exe" }
          $portable = Join-Path $PWD "dist\Win11MagicUpgrade-Portable"
          if (Test-Path -LiteralPath $portable) {
            Copy-Item -LiteralPath $exe -Destination (Join-Path $portable "Win11MagicUpgrade.exe") -Force
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          $self = ($sig.SignerCertificate.Subject -eq $sig.SignerCertificate.Issuer)
          $smart = (($sig.Status -eq "Valid") -and (-not $self) -and $null -ne $sig.SignerCertificate)
          $pubTxt = @(
            "Publisher: dlnraja (SignPath OSS)",
            "GitHub: https://github.com/dlnraja/win11-magic-upgrade",
            ("Signed: {0}" -f (Get-Date).ToString("o")),
            "Mode: signpath",
            ("SmartScreenReady: {0}" -f $smart),
            ("Thumbprint: {0}" -f $sig.SignerCertificate.Thumbprint),
            ("Subject: {0}" -f $sig.SignerCertificate.Subject),
            ("Issuer: {0}" -f $sig.SignerCertificate.Issuer),
            ("Status: {0}" -f $sig.Status),
            "PFX: signpath"
          )
          $pubTxt -join "`n" | Set-Content -LiteralPath (Join-Path $PWD "dist\PUBLISHER.txt") -Encoding ASCII
          @{
            publisher = "dlnraja"
            mode = "signpath"
            smartscreen_ready = $smart
            subject = $sig.SignerCertificate.Subject
            issuer = $sig.SignerCertificate.Issuer
            thumbprint = $sig.SignerCertificate.Thumbprint
            status = [string]$sig.Status
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $PWD "dist\PUBLISHER.json") -Encoding ASCII
          if (Test-Path -LiteralPath $portable) {
            Copy-Item (Join-Path $PWD "dist\PUBLISHER.txt") (Join-Path $portable "PUBLISHER.txt") -Force
            Copy-Item (Join-Path $PWD "dist\PUBLISHER.json") (Join-Path $portable "PUBLISHER.json") -Force
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\package_release.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\verify_signature.ps1 `
            -ExePath $exe `
            -AnyPublisher `
            -RequireTrusted
          if (Test-Path .\dist\PUBLISHER.txt) { Get-Content .\dist\PUBLISHER.txt }

      - name: Declare AV trust (VirusTotal + Kaspersky OpenTIP)
        shell: powershell
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          MAGIC_VT_API_KEY: ${{ secrets.MAGIC_VT_API_KEY }}
          MAGIC_KASPERSKY_OPENTIP_KEY: ${{ secrets.MAGIC_KASPERSKY_OPENTIP_KEY }}
          KASPERSKY_OPENTIP_KEY: ${{ secrets.KASPERSKY_OPENTIP_KEY }}
          MAGIC_AV_OPEN_BROWSER: "0"
          MAGIC_AV_OPEN_MAIL: "0"
        run: |
          # Cloud FP declarations belong in CI/CD — never in the desktop app / One-Click.
          powershell -NoProfile -ExecutionPolicy Bypass -File .\build\ci_declare_av.ps1 `
            -ExePath .\dist\Win11MagicUpgrade.exe `
            -OutDir .\dist\fp_ci

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Win11MagicUpgrade-Portable
          path: |
            dist/Win11MagicUpgrade-Portable/**
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DOWNLOAD.txt
            dist/PUBLISHER.txt
            dist/PUBLISHER.json
            dist/RELEASE-ASSETS.json
            dist/AV_TRUST_CI.json
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (tags only)
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DOWNLOAD.txt
            dist/PUBLISHER.txt
            dist/Win11MagicUpgrade.exe
          generate_release_notes: true
          body: |
            ## Download (Chrome-friendly)

            **Prefer the ZIP** (Chrome Safe Browsing often blocks naked EXEs on new builds):

            1. `Win11MagicUpgrade-Portable-v*.zip`
            2. Verify `SHA256SUMS.txt`
            3. Extract then run `Win11MagicUpgrade.exe` as Administrator

            If Chrome says "virus detected": see [docs/DOWNLOAD.md](https://github.com/dlnraja/win11-magic-upgrade/blob/main/docs/DOWNLOAD.md) - Keep anyway / Unblock-File / report FP to Google.

            ## Publisher / AV trust (CI only)

            Authenticode: **dlnraja** (Release workflow).
            SmartScreen: OV/EV `.pfx` or SignPath — [docs/CODESIGN.md](https://github.com/dlnraja/win11-magic-upgrade/blob/main/docs/CODESIGN.md).
            **Antivirus trust** (VirusTotal + Kaspersky OpenTIP) runs in this Release job — **not** inside One-Click.
            Secrets: `VIRUSTOTAL_API_KEY`, `MAGIC_KASPERSKY_OPENTIP_KEY`.

            Not malware - open source MIT. See SECURITY.md.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
